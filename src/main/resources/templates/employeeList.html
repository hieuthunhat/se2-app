<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
</head>

<body>

<div layout:fragment="content">
    <h2>EMPLOYEE LIST</h2>
    <div class="filterContainer">
        Company:
        <select id="filterCompany">
            <option value="0">All companies</option>
            <option th:each="comp : ${companies}" th:value="${comp.id}" th:text="${comp.name}"></option>
        </select>
        Sort:
        <select id="sortOptions">
            <option value="0">Latest</option>
            <option value="1">Oldest</option>
            <option value="2">By name ASC</option>
            <option value="3">By name DESC</option>
        </select>
        <button id="searchButton" onclick="filterRedirect()">Search</button>
    </div>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Image</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>

            <td>
                <a th:href="@{/detail/{id}(id=${employee.id})}" th:text="${employee.name}">
                </a>
            </td>

            <td>
                <img th:src="${employee.image}" width="100" height="100"/>
            </td>

            <td>
                <a th:href="@{/update/{id}(id=${employee.id})}">
                    UPDATE
                </a>
            </td>

            <td>
                <a th:href="@{/delete/{id}(id=${employee.id})}" onclick="return confirm('Are you sure?')">
                    DELETE
                </a>
            </td>
        </tr>
    </table>
    <script>
        let comId = [[${comId}]];
        let sortMode = [[${sortMode}]];

        function filterRedirect() {
          comId = document.getElementById("filterCompany").value;
          sortMode = document.getElementById("sortOptions").value;
          let url = "/employee/list?company=" + comId + "&sort=" + sortMode;
          window.location.href = url; // redirect
        }

        window.addEventListener("load", function() {
          // Set the selected values from server
          const comFilter = document.getElementById("filterCompany");
          comFilter.value = comId;

          const sortMenu = document.getElementById("sortOptions");
          sortMenu.value = sortMode;
        });
    </script>
</div>
</body>

</html>
