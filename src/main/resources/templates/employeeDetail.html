<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout">

<head>
  <title>Employee Detail</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .card {
      width: 400px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    img {
      max-width: 150px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <h2>Employee Detail</h2>

  <div class="card" layout:fragment="content">
    <p><strong>ID:</strong> <span th:text="${employee.id}"></span></p>
    <p><strong>Name:</strong> <span th:text="${employee.name}"></span></p>
    <p><strong>Age:</strong> <span th:text="${employee.age}"></span></p>
    <p><strong>Address:</strong> <span th:text="${employee.address}"></span></p>

    <div th:if="${employee.image}">
      <p><strong>Image:</strong></p>
      <img th:src="@{/images/{img}(img=${employee.image})}" alt="Employee Image" />
    </div>
  </div>

  <br>

  <a href="/">⬅ Back to Employee List</a>

</body>

</html>
